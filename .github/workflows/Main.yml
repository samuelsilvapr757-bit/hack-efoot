name: Build HackEFoot

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Instalar Theos (sem GitHub API)
        run: |
          git clone --depth=1 https://github.com/theos/theos.git /tmp/theos
          echo "THEOS=/tmp/theos" >> $GITHUB_ENV
          cd /tmp/theos
          git clone --depth=1 https://github.com/theos/headers.git headers
          mkdir -p sdks
          echo "Theos instalado em /tmp/theos"
      
      - name: Verificar arquivos
        run: |
          echo "Arquivos no repositório:"
          ls -la
          
      - name: Compilar
        run: |
          export THEOS=/tmp/theos
          make package ARCHS=arm64 DEBUG=0
          echo ""
          echo "=== ARQUIVOS GERADOS ==="
          find . -name "*.dylib" -o -name "*.plist" -o -name "*.deb" 2>/dev/null
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: HackEFoot
          path: |
            .theos/obj/debug/arm64/HackEFoot.dylib
            .theos/obj/arm64/HackEFoot.dylib
            HackEFoot.plist
            packages/*.deb
          if-no-files-found: warn
